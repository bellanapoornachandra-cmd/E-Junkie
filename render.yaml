databases:
  - name: ejunkie-postgres
    plan: free
    databaseName: ejunkie
    user: ejunkie

services:
  - type: web
    name: e-junkie
    runtime: docker
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ejunkie-postgres
          property: connectionString
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
